name: Release

# Single maintainer-gated entry point for cutting a release. It bumps the version,
# tags it, publishes health-mcp to npm (OIDC trusted publishing — no tokens), and
# pushes the versioned + :latest images to GHCR. Triggered manually only, so forks
# and pull requests can never run it.
#
# npm trusted publishing is configured against THIS filename (release.yml). Renaming
# the file breaks publishing until the trusted publisher on npmjs.com is updated.
# See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and validate without publishing or pushing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Bump, publish & tag
    runs-on: ubuntu-latest
    if: github.repository == 'lukaisailovic/health-mcp'
    environment: release
    permissions:
      contents: write # bump commit, tag, push, GitHub release
      packages: write # push images to GHCR
      id-token: write # npm OIDC trusted publishing + provenance attestation
      attestations: write # image build provenance
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] credentials are needed to push the bump commit + tag; this job uploads no artifacts.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] this release job enables no caching (no setup-node cache, no buildx gha cache), so there is nothing to poison.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before typecheck: vite build generates the dashboard's routeTree.gen.ts.
      - name: Lint, build, typecheck & test
        run: |
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Resolve next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          cd apps/server
          npm version "$RELEASE_TYPE" --no-git-tag-version --no-commit-hooks >/dev/null
          # npm version reserializes package.json with its own formatter (e.g. expands the
          # "files" array); re-apply biome's formatting so the committed bump keeps CI green.
          pnpm exec biome format --write package.json
          version="$(node -p "require('./package.json').version")"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "major_minor=${version%.*}"
            echo "prerelease=$prerelease"
            if [ "$prerelease" = true ]; then echo "is_release=false"; else echo "is_release=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Preflight — refuse to clobber an existing release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::git tag ${TAG} already exists"
            exit 1
          fi
          if npm view "health-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::health-mcp@${VERSION} is already published to npm"
            exit 1
          fi

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): health-mcp ${TAG}"
          git tag -a "${TAG}" -m "health-mcp ${VERSION}"

      # Push commit + tag together (atomic) BEFORE publishing, so a blocked push
      # (e.g. branch protection) fails the run before anything is published.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_release }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # OIDC trusted publishing is an npm-CLI feature requiring npm >= 11.5.1; the version
      # bundled with Node 22 is older, and pnpm delegates the publish to it. Upgrade first.
      - name: Upgrade npm for OIDC trusted publishing
        if: ${{ !inputs.dry_run }}
        run: npm install --global npm@latest

      # No NPM_TOKEN: npm mints a short-lived token from id-token:write. pnpm resolves the
      # workspace:* dep, runs prepack (build), and hands the tarball to npm for the publish.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter health-mcp publish --no-git-checks --provenance --access public

      - name: Validate npm package (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm --filter health-mcp publish --no-git-checks --dry-run

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag --title "${TAG}")
          if [ "${PRERELEASE}" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${TAG}" "${flags[@]}"
